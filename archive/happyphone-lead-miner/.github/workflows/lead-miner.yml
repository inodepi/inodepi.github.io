name: Continuous 4-Hour Lead Scraper
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  scrape-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y whois
          pip install requests pandas python-whois
      - name: Source New Targets
        run: python src/sourcer.py
      - name: Run Lead Scraper Engine
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/miner.py
      - name: Commit and Push Updated History
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add processed_domains.csv incoming_targets.json sourcing_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit. Skipping history push."
            exit 0
          fi
          git commit -m "auto-update: domain history + queue drain [skip ci]"
          ok=0
          for i in 1 2 3; do
            if git push origin main; then
              ok=1
              echo "Pushed on attempt $i"
              break
            fi
            echo "Push rejected (attempt $i); rebasing onto latest main"
            git fetch origin main
            git pull --rebase --autostash -X theirs origin main || git rebase --abort
            git add processed_domains.csv incoming_targets.json sourcing_state.json
            git commit -m "auto-update: domain history + queue drain [skip ci]" || true
          done
          if [ "$ok" != "1" ]; then
            echo "Push failed after 3 attempts"
            exit 1
          fi
